<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正版授权自助激活中心</title>
    <style>
        body { font-family: sans-serif; background-color: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #111827; margin-top: 0; }
        input { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; box-sizing: border-box; margin-bottom: 12px; font-family: monospace; }
        button { width: 100%; padding: 12px; background-color: #2563eb; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .result { margin-top: 15px; padding: 15px; background-color: #ecfdf5; border: 1px solid #a7f3d0; border-radius: 8px; display: none; text-align: center; }
        .key { font-size: 20px; font-weight: bold; color: #047857; margin-top: 5px; font-family: monospace; }
    </style>
</head>
<body>
    <div class="card">
        <h2>⚡ 软件正版授权激活</h2>
        <input type="text" id="cardId" placeholder="请输入购买获取的卡密 (如 KM-XXXX-XXXX)">
        <input type="text" id="machineCode" placeholder="请输入软件显示的 16 位机器码">
        <button onclick="fetchKey()">校验并生成激活码</button>

        <div class="result" id="resultArea">
            <div style="font-size: 12px; color: #065f46;">您的专属激活码：</div>
            <div class="key" id="licenseKey">---</div>
        </div>
    </div>

    <script>
        async function fetchKey() {
            const cardId = document.getElementById('cardId').value.trim();
            const machineCode = document.getElementById('machineCode').value.trim();

            if (!cardId || !machineCode) {
                alert('请同时填写卡密与机器码！');
                return;
            }

            try {
                const response = await fetch('/api/index.py', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ card_id: cardId, machine_code: machineCode })
                });
                const data = await response.json();

                if (response.ok && data.license_key) {
                    document.getElementById('licenseKey').innerText = data.license_key;
                    document.getElementById('resultArea').style.display = 'block';
                } else {
                    alert('激活失败：' + (data.error || '卡密无效'));
                }
            } catch (err) {
                alert('网络连接错误，请重试！');
            }
        }
    </script>
</body>
</html>
